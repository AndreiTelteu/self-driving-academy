<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scenario harness · Self Driving Academy</title>
  </head>
  <body>
    <h1>Harness de scenarii</h1>
    <p>
      Fixture aritmetică de test; fără gameplay sau renderer. Seed selectează scriptul de
      incrementare.
    </p>
    <form id="scenario">
      <label>Seed <input name="seed" type="number" min="0" step="1" value="41" required /></label
      ><label
        >Tick-uri
        <input name="ticks" type="number" min="0" max="10000" step="1" value="12" required /></label
      ><button>Rulează și verifică</button>
    </form>
    <p id="status" role="status">Pregătit</p>
    <pre id="capture"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
