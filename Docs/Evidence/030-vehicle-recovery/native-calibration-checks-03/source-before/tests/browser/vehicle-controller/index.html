<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>024 unified vehicle controller fixture</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        background: #14202d;
        color: #f3f7fb;
        font: 16px system-ui;
      }
      .controls {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1;
        background: #14202ded;
        padding: 12px;
        max-width: 700px;
      }
      pre {
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
      }
      canvas {
        display: block;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <strong>024 — same mechanics, two command sources</strong>
      <p>Blue: PLAYER 60Hz. Green: AUTONOMY targets 10Hz. Yellow lamps: authoritative signals.</p>
      <select id="backend">
        <option>AUTO</option>
        <option>WEBGL2</option>
      </select>
      <button id="run">Drive sedan and compact, then transfer authority</button>
      <pre id="status">Not run. Exclusive real headed Chrome slot required.</pre>
    </div>
    <canvas id="canvas" width="1920" height="1080"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
