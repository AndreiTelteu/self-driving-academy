<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>267 KPI dashboard fixture</title>
    <link rel="stylesheet" href="../../src/style.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #08120f;
        color: #f3f7fb;
        font:
          0.9rem/1.4 system-ui,
          sans-serif;
      }
      #controls {
        display: flex;
        gap: 0.5rem;
        padding: 1rem;
      }
      #controls button {
        font: inherit;
        padding: 0.35rem 0.7rem;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <button id="kpi-trigger" type="button">KPIs</button>
      <button id="city-trigger" type="button">Oraș</button>
      <button id="impact-run" type="button">Rulează feedback</button>
    </div>
    <div id="kpi-host"></div>
    <div id="city-host"></div>
    <div id="impact-host"></div>
    <script type="module" src="./kpi-dashboard-browser.ts"></script>
  </body>
</html>
