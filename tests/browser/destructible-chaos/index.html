<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>285 destructible browser probe</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0d1014;
        color: #f4ead8;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      #stage {
        display: block;
        width: 960px;
        height: 540px;
      }
      #unlock {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 5;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #e8b86b;
        background: #2a2112;
        color: #fff1d6;
        cursor: pointer;
      }
      #notice {
        position: absolute;
        left: 12px;
        bottom: 12px;
        max-width: 600px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #e8b86b;
        background: rgba(28, 22, 10, 0.92);
        color: #fff1d6;
        pointer-events: none;
      }
      #notice[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="960" height="540"></canvas>
    <button id="unlock" type="button">Pornește audio</button>
    <div id="notice" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
