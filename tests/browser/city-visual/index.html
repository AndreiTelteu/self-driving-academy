<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PBI042 cartier Babylon</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font:
          13px/1.4 system-ui,
          sans-serif;
        background: #0b0f14;
        color: #e8eef4;
      }
      #host {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #host canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        max-width: 420px;
        max-height: 90vh;
        overflow: auto;
        padding: 8px 10px;
        background: #0b0f14ee;
        border: 1px solid #24303c;
        border-radius: 6px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        white-space: pre-wrap;
      }
      #panel h1 {
        margin: 0 0 6px;
        font-size: 13px;
        font-family: system-ui, sans-serif;
      }
      #panel.compact {
        max-width: 320px;
        padding: 6px 8px;
      }
      #panel.compact h1 {
        font-size: 11px;
      }
      #status[data-state='error'] {
        color: #ff8a80;
      }
      #status[data-state='ready'] {
        color: #8ff0a4;
      }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <div id="panel">
      <h1>PBI042 · cartier compact · Babylon.js</h1>
      <div id="status" role="status" data-state="loading">Se construiește cartierul…</div>
      <div id="result"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
