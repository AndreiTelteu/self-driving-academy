<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>PBI283 traffic rules browser fixture</title>
    <style>
      body {
        margin: 0;
        background: #0b161c;
        color: #e8f4f8;
        font:
          14px/1.45 system-ui,
          sans-serif;
      }
      #frame {
        display: flex;
        gap: 12px;
        padding: 12px;
      }
      canvas {
        background: #12242c;
        border-radius: 8px;
      }
      aside {
        max-width: 330px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: #1f6f8b;
      }
      .red {
        background: #a5251b;
      }
      .green {
        background: #1c7a43;
      }
      #notice {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #ff7a6b;
        border-radius: 8px;
        background: #340808;
        display: none;
      }
      pre {
        white-space: pre-wrap;
        font-size: 12px;
        color: #b9d7e2;
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="view" width="900" height="620"></canvas>
      <aside>
        <h1>PBI283 — reguli live în browser</h1>
        <div><span id="phase" class="badge">BOOT</span></div>
        <p id="line">Se inițializează traficul 058 peste harta 032/033.</p>
        <div id="notice" role="status" aria-live="polite"></div>
        <pre id="report"></pre>
      </aside>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
