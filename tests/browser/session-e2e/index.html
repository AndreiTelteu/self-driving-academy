<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sesiune E2E 152 · Self Driving Academy</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0 auto;
        max-width: 72rem;
        padding: 1.5rem;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 {
        font-size: 1.4rem;
        margin-top: 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 1rem 0;
      }
      th,
      td {
        border-bottom: 1px solid #334155;
        padding: 0.35rem 0.5rem;
        text-align: left;
        vertical-align: top;
        font-size: 0.9rem;
      }
      .pass {
        color: #4ade80;
      }
      .fail {
        color: #f87171;
      }
      code {
        color: #fbbf24;
      }
      #status {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Sesiune integrală 152 — profil nou, export și restart</h1>
    <p>
      Pagina rulează aceleași contracte ca transcriptul determinist, într-un Chromium real.
      Documentele exportate sunt păstrate în IndexedDB; reîncărcarea paginii este restartul.
    </p>
    <p id="status" role="status">Se pregătește…</p>
    <table>
      <thead>
        <tr>
          <th>Pas</th>
          <th>Verificări</th>
          <th>Verdict</th>
        </tr>
      </thead>
      <tbody id="steps"></tbody>
    </table>
    <pre id="detail"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
